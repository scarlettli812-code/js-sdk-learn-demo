<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>新品排产助手</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <span class="eyebrow">LARK BASE · SCHEDULER</span>
        <h1>新品排产助手</h1>
        <p>按确定性规则读取需求和产能，生成 by 天排产及区域交付结果。</p>
      </section>

      <section class="card status-card">
        <div>
          <span class="label">连接状态</span>
          <strong id="statusText">正在连接飞书多维表格…</strong>
        </div>
        <span id="statusDot" class="status-dot loading" aria-hidden="true"></span>
      </section>

      <section class="card">
        <div class="section-title">
          <div>
            <span class="label">数据准备</span>
            <h2><span id="tableCount">0</span> / 5 张表已识别</h2>
          </div>
          <button id="refreshButton" class="button ghost" type="button">重新读取</button>
        </div>
        <p id="readinessText" class="hint">正在核对数据表…</p>
        <div class="stats">
          <div class="stat">
            <span>需求记录</span>
            <strong id="demandCount">—</strong>
          </div>
          <div class="stat">
            <span>产能记录</span>
            <strong id="capacityCount">—</strong>
          </div>
        </div>
      </section>

      <section class="card schedule-card">
        <span class="label">执行排产</span>
        <h2>生成一个新的当前版本</h2>
        <p>旧结果会保留为历史版本；缺少参数或产能不足时会在控制台标记“有异常”。</p>
        <button id="scheduleButton" class="button primary full" type="button" disabled>重新排产</button>
      </section>

      <section id="runPanel" class="card run-card" hidden>
        <span class="label">本次运行</span>
        <h2 id="runSummary">排产进行中</h2>
        <p id="runDetails">正在准备数据…</p>
      </section>

      <p class="privacy">计算在插件中完成，不会把多维表格数据发送到外部服务器。</p>
    </main>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
